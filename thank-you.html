<!DOCTYPE html>
<html dir="rtl" lang="he-IL">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>תודה! – המטייל החכם</title>
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Assistant', sans-serif;
      background-color: #0F172B;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }

    .card {
      background: #ffffff;
      max-width: 560px;
      width: 100%;
      border-radius: 24px;
      padding: 48px 40px;
      text-align: center;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.4);
    }

    .checkmark-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 28px;
    }

    .checkmark-circle {
      width: 80px;
      height: 80px;
      background-color: #F97316;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: popIn 0.5s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
    }

    .checkmark-circle svg {
      width: 40px;
      height: 40px;
      stroke: #ffffff;
      stroke-width: 3;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    @keyframes popIn {
      0%   { transform: scale(0); }
      70%  { transform: scale(1.2); }
      100% { transform: scale(1); }
    }

    .title {
      font-size: 32px;
      font-weight: 800;
      color: #0F172B;
      margin-bottom: 10px;
      line-height: 1.2;
    }

    .subtitle {
      font-size: 18px;
      font-weight: 600;
      color: #6B7280;
      margin-bottom: 32px;
    }

    .info-boxes {
      display: flex;
      flex-direction: column;
      margin-bottom: 32px;
      text-align: right;
    }

    .info-box {
      background-color: #FFF7ED;
      border-right: 3px solid #F97316;
      border-radius: 12px;
      padding: 14px 16px;
      margin: 6px 0;
      font-size: 15px;
      font-weight: 600;
      color: #374151;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .info-box .icon {
      font-size: 20px;
      flex-shrink: 0;
    }

    .whatsapp-btn {
      display: block;
      width: 100%;
      background-color: #25D366;
      color: #ffffff;
      text-decoration: none;
      font-family: 'Assistant', sans-serif;
      font-size: 16px;
      font-weight: 700;
      padding: 16px 24px;
      border-radius: 50px;
      margin-bottom: 24px;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    .whatsapp-btn:hover {
      background-color: #1ebe5d;
      transform: translateY(-1px);
    }

    .whatsapp-btn:active {
      transform: translateY(0);
    }

    .home-link {
      display: inline-block;
      color: #F97316;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      transition: opacity 0.2s ease;
    }

    .home-link:hover {
      opacity: 0.75;
      text-decoration: underline;
    }

    @media (max-width: 480px) {
      .card {
        padding: 36px 24px;
      }
      .title {
        font-size: 26px;
      }
    }
  </style>
</head>
<body>
  <div class="card">

    <div class="checkmark-wrap">
      <div class="checkmark-circle">
        <svg viewBox="0 0 24 24">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      </div>
    </div>

    <h1 class="title" id="title">תודה! 🎒</h1>
    <p class="subtitle">ההזמנה שלך מחכה לך!</p>

    <div class="info-boxes">
      <div class="info-box">
        <span class="icon">📧</span>
        <span>שלחנו לך סיכום מלא למייל</span>
      </div>
      <div class="info-box">
        <span class="icon">📞</span>
        <span>ניצור איתך קשר תוך 24 שעות לתיאום</span>
      </div>
      <div class="info-box">
        <span class="icon">🚚</span>
        <span>נדאג לכל הציוד עד הבית</span>
      </div>
    </div>

    <a class="whatsapp-btn" href="https://wa.me/972523960215" target="_blank" rel="noopener noreferrer">
      💬 דברו איתנו ב-WhatsApp
    </a>

    <a class="home-link" href="index.html">חזרה לדף הבית</a>

  </div>

  <script>
    (function () {
      var name = new URLSearchParams(location.search).get('name');
      var displayName = (name && name.trim()) ? name.trim() : 'חבר/ה';
      document.getElementById('title').textContent = 'תודה ' + displayName + '! 🎒';
    })();
  </script>
</body>
</html>
