<!DOCTYPE html>
<html dir="rtl" lang="he-IL">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>סיכום הזמנה – המטייל החכם</title>
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Assistant', sans-serif;
      background: #F1F5F9;
      color: #1E293B;
      min-height: 100vh;
      direction: rtl;
    }

    /* ── Header ── */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: #0F172B;
      padding: 0 28px;
      height: 66px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 16px rgba(0,0,0,.4);
    }

    .logo {
      font-size: 22px;
      font-weight: 800;
      color: #fff;
      text-decoration: none;
      letter-spacing: -0.3px;
    }

    .wa-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #25D366;
      color: #fff;
      font-family: 'Assistant', sans-serif;
      font-size: 15px;
      font-weight: 700;
      padding: 10px 22px;
      border-radius: 50px;
      text-decoration: none;
      transition: background .2s, transform .15s;
      white-space: nowrap;
    }
    .wa-btn:hover { background: #1ebe5d; transform: translateY(-1px); }

    /* ── Page heading ── */
    .page-heading {
      text-align: center;
      padding: 52px 24px 36px;
    }
    .page-heading h1 {
      font-size: 36px;
      font-weight: 800;
      color: #F97316;
      line-height: 1.2;
    }
    .page-heading p {
      margin-top: 10px;
      font-size: 17px;
      color: #64748B;
      font-weight: 600;
    }

    /* ── Main layout ── */
    .main-wrapper {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 20px 56px;
      display: grid;
      grid-template-columns: 55% 1fr;
      gap: 28px;
      align-items: start;
    }

    /* ── Cards ── */
    .card {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 4px 28px rgba(15,23,43,.09);
      overflow: hidden;
    }

    .card-header {
      background: linear-gradient(135deg, #0F172B 0%, #1E3A5F 100%);
      padding: 22px 28px;
    }
    .card-header h2 {
      font-size: 20px;
      font-weight: 800;
      color: #fff;
    }

    .card-body {
      padding: 26px 28px;
    }

    /* ── Cart items ── */
    .cart-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 14px;
      border-radius: 12px;
      gap: 12px;
      transition: background .15s;
    }
    .cart-row:nth-child(odd)  { background: #F8FAFC; }
    .cart-row:nth-child(even) { background: #fff; }
    .cart-row:hover { background: #FFF7ED; }

    .cart-item-info {
      display: flex;
      flex-direction: column;
      gap: 5px;
      flex: 1;
      min-width: 0;
    }
    .cart-item-name {
      font-size: 16px;
      font-weight: 700;
      color: #1E293B;
      line-height: 1.3;
    }
    .badges-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .cart-badge {
      display: inline-block;
      font-size: 12px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 50px;
    }
    .badge-rent { background: #DBEAFE; color: #1D4ED8; }
    .badge-buy  { background: #DCFCE7; color: #166534; }
    .badge-free { background: #FEF9C3; color: #92400E; }

    .cart-duration {
      font-size: 12px;
      font-weight: 600;
      color: #94A3B8;
    }

    .cart-item-price {
      font-size: 18px;
      font-weight: 800;
      color: #F97316;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .cart-divider {
      border: none;
      border-top: 1.5px dashed #E2E8F0;
      margin: 10px 0 4px;
    }

    .cart-total {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 14px 2px;
    }
    .cart-total span:first-child {
      font-size: 18px;
      font-weight: 800;
      color: #0F172B;
    }
    .cart-total span:last-child {
      font-size: 26px;
      font-weight: 800;
      color: #F97316;
    }

    .cart-empty {
      text-align: center;
      padding: 48px 20px;
      color: #94A3B8;
      font-size: 16px;
      font-weight: 600;
    }
    .cart-empty a {
      color: #F97316;
      text-decoration: none;
      font-weight: 700;
    }
    .cart-empty a:hover { text-decoration: underline; }

    /* ── Form ── */
    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 700;
      color: #475569;
      margin-bottom: 6px;
    }
    label .req {
      color: #F97316;
      margin-right: 2px;
    }

    input[type="text"],
    input[type="tel"],
    input[type="email"],
    input[type="date"],
    textarea {
      width: 100%;
      border: 1.5px solid #E2E8F0;
      border-radius: 12px;
      padding: 14px 16px;
      font-family: 'Assistant', sans-serif;
      font-size: 16px;
      font-weight: 600;
      color: #1E293B;
      background: #FAFBFC;
      outline: none;
      transition: border-color .2s, box-shadow .2s, background .2s;
      direction: rtl;
    }
    input[type="text"]:focus,
    input[type="tel"]:focus,
    input[type="email"]:focus,
    input[type="date"]:focus,
    textarea:focus {
      border-color: #F97316;
      background: #fff;
      box-shadow: 0 0 0 3px rgba(249,115,22,.12);
    }
    textarea { resize: vertical; }

    /* Gender pill toggle */
    .gender-group { display: flex; gap: 10px; }
    .gender-group input[type="radio"] { display: none; }
    .gender-label {
      flex: 1;
      text-align: center;
      padding: 12px 0;
      border: 1.5px solid #E2E8F0;
      border-radius: 50px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 700;
      color: #64748B;
      background: #FAFBFC;
      transition: all .2s;
      margin-bottom: 0 !important;
      user-select: none;
    }
    .gender-group input[type="radio"]:checked + .gender-label {
      background: #F97316;
      border-color: #F97316;
      color: #fff;
      box-shadow: 0 4px 14px rgba(249,115,22,.35);
    }
    .gender-label:hover {
      border-color: #F97316;
      color: #F97316;
    }
    .gender-group input[type="radio"]:checked + .gender-label:hover {
      color: #fff;
    }

    /* Submit button */
    .submit-btn {
      display: block;
      width: 100%;
      background: #F97316;
      color: #fff;
      font-family: 'Assistant', sans-serif;
      font-size: 18px;
      font-weight: 800;
      padding: 18px;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      margin-top: 10px;
      transition: background .2s, transform .15s, box-shadow .2s;
      box-shadow: 0 6px 20px rgba(249,115,22,.35);
      letter-spacing: 0.3px;
    }
    .submit-btn:hover:not(:disabled) {
      background: #EA6A0A;
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(249,115,22,.45);
    }
    .submit-btn:disabled {
      opacity: .72;
      cursor: not-allowed;
    }

    .submit-footer {
      text-align: center;
      margin-top: 14px;
      font-size: 13px;
      font-weight: 600;
      color: #94A3B8;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
    }
    .submit-footer a {
      color: #25D366;
      text-decoration: none;
      font-weight: 700;
    }
    .submit-footer a:hover { text-decoration: underline; }
    .submit-footer .sep { color: #CBD5E1; }

    /* ── Trust badges ── */
    .trust-row {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 20px 52px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }
    .trust-badge {
      background: #fff;
      border-radius: 18px;
      padding: 24px 16px;
      text-align: center;
      box-shadow: 0 2px 14px rgba(15,23,43,.07);
      transition: transform .2s, box-shadow .2s;
    }
    .trust-badge:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 26px rgba(15,23,43,.11);
    }
    .trust-badge .badge-icon {
      font-size: 34px;
      display: block;
      margin-bottom: 8px;
    }
    .trust-badge .badge-title {
      font-size: 16px;
      font-weight: 800;
      color: #0F172B;
    }
    .trust-badge .badge-sub {
      font-size: 13px;
      font-weight: 600;
      color: #94A3B8;
      margin-top: 4px;
    }

    /* ── Field error state ── */
    .input-error {
      border-color: #EF4444 !important;
      box-shadow: 0 0 0 3px rgba(239,68,68,.14) !important;
    }

    /* ── Mobile ── */
    @media (max-width: 768px) {
      .main-wrapper {
        grid-template-columns: 1fr;
        gap: 20px;
        padding: 0 14px 44px;
      }
      .page-heading h1 { font-size: 26px; }
      .page-heading { padding: 32px 16px 22px; }
      .trust-row {
        grid-template-columns: 1fr;
        padding: 0 14px 40px;
        gap: 12px;
      }
      .card-body  { padding: 20px 18px; }
      .card-header { padding: 18px 18px; }
      .site-header { padding: 0 16px; }
    }
  </style>
</head>
<body>

  <!-- ── Header ── -->
  <header class="site-header">
    <a class="logo" href="index.html">המטייל החכם 🎒</a>
    <a class="wa-btn" href="https://wa.me/972501234567" target="_blank" rel="noopener">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
      </svg>
      דברו איתנו!
    </a>
  </header>

  <!-- ── Page heading ── -->
  <div class="page-heading">
    <h1>🛒 סיכום ואישור הזמנה</h1>
    <p>בדקו את הפריטים שבחרתם ומלאו פרטים לאישור</p>
  </div>

  <!-- ── Two-column layout ── -->
  <div class="main-wrapper">

    <!-- Left column: Cart summary -->
    <div class="card">
      <div class="card-header">
        <h2>🛒 הפריטים שלכם</h2>
      </div>
      <div class="card-body">
        <div id="cart-items">
          <!-- populated by JS -->
        </div>
      </div>
    </div>

    <!-- Right column: Order form -->
    <div class="card">
      <div class="card-header">
        <h2>📋 פרטים לאישור ההזמנה</h2>
      </div>
      <div class="card-body">
        <form id="order-form" novalidate>

          <div class="form-group">
            <label for="customer-name">שם מלא <span class="req">*</span></label>
            <input type="text" id="customer-name" placeholder="ישראל ישראלי" required autocomplete="name">
          </div>

          <div class="form-group">
            <label for="customer-phone">מספר טלפון <span class="req">*</span></label>
            <input type="tel" id="customer-phone" placeholder="050-000-0000" required autocomplete="tel">
          </div>

          <div class="form-group">
            <label for="customer-email">כתובת מייל</label>
            <input type="email" id="customer-email" placeholder="israel@example.com" autocomplete="email">
          </div>

          <div class="form-group">
            <label>מין</label>
            <div class="gender-group">
              <input type="radio" id="gender-male"   name="customer-gender" value="male">
              <label class="gender-label" for="gender-male">👨 זכר</label>

              <input type="radio" id="gender-female" name="customer-gender" value="female">
              <label class="gender-label" for="gender-female">👩 נקבה</label>
            </div>
          </div>

          <div class="form-group">
            <label for="customer-flight-date">תאריך טיסה</label>
            <input type="date" id="customer-flight-date">
          </div>

          <div class="form-group">
            <label for="customer-address">כתובת למשלוח</label>
            <textarea id="customer-address" rows="2" placeholder="רחוב, עיר, מיקוד"></textarea>
          </div>

          <div class="form-group">
            <label for="customer-notes">הערות נוספות</label>
            <textarea id="customer-notes" rows="3" placeholder="כל מידע נוסף שיעזור לנו לשרת אותך טוב יותר..."></textarea>
          </div>

          <button type="submit" class="submit-btn" id="submit-btn">שלח הזמנה 🎒</button>

          <div class="submit-footer">
            <span>🔒 הזמנה מאובטחת</span>
            <span class="sep">|</span>
            <span>💬 שאלות? <a href="https://wa.me/972501234567" target="_blank" rel="noopener">WhatsApp</a></span>
          </div>

        </form>
      </div>
    </div>

  </div>

  <!-- ── Trust badges ── -->
  <div class="trust-row">
    <div class="trust-badge">
      <span class="badge-icon">🔒</span>
      <div class="badge-title">מאובטח לחלוטין</div>
      <div class="badge-sub">פרטיכם שמורים בבטחה</div>
    </div>
    <div class="trust-badge">
      <span class="badge-icon">⭐</span>
      <div class="badge-title">שירות אישי</div>
      <div class="badge-sub">אנחנו כאן בשבילכם</div>
    </div>
    <div class="trust-badge">
      <span class="badge-icon">🎒</span>
      <div class="badge-title">ניסיון של שנים</div>
      <div class="badge-sub">המומחים לציוד טיולים</div>
    </div>
  </div>

  <script>
    /* ── Helpers ── */
    function escHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function formatPrice(n) {
      return Number(n).toLocaleString('he-IL');
    }

    /* ── Load cart ── */
    var cart = [];
    try {
      cart = JSON.parse(localStorage.getItem('smartCart') || '[]');
      if (!Array.isArray(cart)) cart = [];
    } catch(e) { cart = []; }

    /* ── Render cart ── */
    function renderCart() {
      var container = document.getElementById('cart-items');

      if (cart.length === 0) {
        container.innerHTML =
          '<div class="cart-empty">' +
            '<div style="font-size:52px;margin-bottom:14px">🛒</div>' +
            '<p style="font-size:18px;font-weight:700;color:#475569;">העגלה ריקה</p>' +
            '<p style="margin-top:10px"><a href="index.html">← חזרה לחנות</a></p>' +
          '</div>';
        return;
      }

      var total = 0;
      var html  = '';

      cart.forEach(function(item) {
        var qty       = item.qty || 1;
        var linePrice = (item.price || 0) * qty;
        total += linePrice;

        var modeLabel, badgeCls;
        if (item.mode === 'rent') {
          modeLabel = '🔄 השכרה'; badgeCls = 'badge-rent';
        } else if (item.mode === 'free') {
          modeLabel = '🎁 חינם';   badgeCls = 'badge-free';
        } else {
          modeLabel = '🛍️ קנייה'; badgeCls = 'badge-buy';
        }

        html +=
          '<div class="cart-row">' +
            '<div class="cart-item-info">' +
              '<span class="cart-item-name">' +
                escHtml(item.name) + (qty > 1 ? ' &times; ' + qty : '') +
              '</span>' +
              '<div class="badges-row">' +
                '<span class="cart-badge ' + badgeCls + '">' + modeLabel + '</span>' +
                (item.duration
                  ? '<span class="cart-duration">' + item.duration + ' חודשים</span>'
                  : '') +
              '</div>' +
            '</div>' +
            '<span class="cart-item-price">₪' + formatPrice(linePrice) + '</span>' +
          '</div>';
      });

      html += '<hr class="cart-divider">';
      html +=
        '<div class="cart-total">' +
          '<span>סה"כ לתשלום</span>' +
          '<span>₪' + formatPrice(total) + '</span>' +
        '</div>';

      container.innerHTML = html;
    }

    /* ── Form validation helpers ── */
    function markError(el) {
      el.classList.add('input-error');
      el.addEventListener('input', function() {
        el.classList.remove('input-error');
      }, { once: true });
    }

    /* ── Form submit ── */
    document.getElementById('order-form').addEventListener('submit', function(e) {
      e.preventDefault();

      var nameEl  = document.getElementById('customer-name');
      var phoneEl = document.getElementById('customer-phone');
      var name    = nameEl.value.trim();
      var phone   = phoneEl.value.trim();

      var valid = true;
      if (!name)  { markError(nameEl);  valid = false; }
      if (!phone) { markError(phoneEl); valid = false; }
      if (!valid) {
        (!name ? nameEl : phoneEl).focus();
        return;
      }

      var btn = document.getElementById('submit-btn');
      btn.disabled    = true;
      btn.textContent = '⏳ שולח...';

      var genderEl = document.querySelector('input[name="customer-gender"]:checked');

      var order = {
        name:       name,
        phone:      phone,
        email:      document.getElementById('customer-email').value.trim(),
        gender:     genderEl ? genderEl.value : '',
        flightDate: document.getElementById('customer-flight-date').value,
        address:    document.getElementById('customer-address').value.trim(),
        notes:      document.getElementById('customer-notes').value.trim(),
        cart:       cart
      };

      fetch('/api/send-order', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify(order)
      }).catch(function() {}).finally(function() {
        localStorage.removeItem('smartCart');
        window.location.href = 'thank-you.html?name=' + encodeURIComponent(order.name);
      });
    });

    /* ── Init ── */
    renderCart();
  </script>
</body>
</html>
